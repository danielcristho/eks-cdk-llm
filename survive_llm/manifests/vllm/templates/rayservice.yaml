{{- $bucket := required "modelBucket is set by CDK" .Values.modelBucket }}
{{- $region := required "region is set by CDK" .Values.region }}
{{- $ray := required "rayVersion is set by CDK" .Values.rayVersion }}
{{- $maxReplicas := required "maxReplicas is set by CDK" .Values.maxReplicas }}
# Runs vLLM as a Ray Serve deployment, routes requests across replicas, autoscaler scales workers, Karpenter provisions GPU nodes
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: vllm
  namespace: kuberay
spec:
  serveConfigV2: |
    applications:
      - name: vllm
        import_path: serve_vllm:build_app
        route_prefix: /
        runtime_env:
          pip:
            - vllm=={{ required "vllmVersion is set by CDK" .Values.vllmVersion }}
            - ray[serve]=={{ $ray }}
            - numpy<2
          env_vars:
            PYTHONPATH: /serve-scripts
        args:
          model: /model-cache/current
          served_model_name: {{ required "servedModelName is set by CDK" .Values.servedModelName }}
          dtype: {{ required "dtype is set by CDK" .Values.dtype }}
          quantization: {{ required "quantization is set by CDK" .Values.quantization }}
          max_model_len: {{ required "maxModelLen is set by CDK" .Values.maxModelLen }}
          download_dir: /model-cache
          _script_sha: {{ .Values.scriptSha | quote }}
        deployments:
          - name: VLLMDeployment
            max_ongoing_requests: 5
            autoscaling_config:
              # static stability: one warm replica per AZ, a new GPU replica needs ~8 min to serve
              min_replicas: 2
              max_replicas: {{ $maxReplicas }}  # set max 2 × g4dn.xlarge
              target_ongoing_requests: 2
            ray_actor_options:
              num_gpus: 1
              memory: 12288
  rayClusterConfig:
    rayVersion: {{ $ray | quote }}
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-gpus: "0"
      template:
        metadata:
          labels:
            role: ray-head
        spec:
          nodeSelector:
            role: system
          containers:
            - name: ray-head
              image: rayproject/ray:{{ $ray }}-gpu
              ports:
                - {containerPort: 6379, name: gcs}
                - {containerPort: 10001, name: client}
                - {containerPort: 8265, name: dashboard}
                - {containerPort: 8000, name: serve}
              resources:
                requests: {cpu: "1", memory: 3Gi}
                limits: {cpu: "2", memory: 6Gi}
              volumeMounts:
                - {name: serve-scripts, mountPath: /serve-scripts}
          volumes:
            - name: serve-scripts
              configMap:
                name: vllm-serve-script
    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 0
        minReplicas: 0
        maxReplicas: {{ $maxReplicas }}  # set max 2 × g4dn.xlarge
        rayStartParams:
          num-gpus: "1"
        template:
          metadata:
            labels:
              role: ray-worker
              workload: gpu
          spec:
            tolerations:
              - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
            nodeSelector:
              workload: gpu
            # Karpenter reads this and launches each GPU node in the zone the pod needs
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels: {role: ray-worker}
                # count this RayCluster's workers only, not the old one's during a blue/green upgrade
                matchLabelKeys: [ray.io/cluster]
            terminationGracePeriodSeconds: 120
            initContainers:
              - name: model-cache-sync
                image: {{ required "awsCliImage is set by CDK" .Values.awsCliImage }}
                command: ["sh", "-c", "aws s3 sync \"$MODEL_URI\" /model-cache/current"]
                env:
                  - {name: AWS_DEFAULT_REGION, value: {{ $region | quote }}}
                  - {name: MODEL_URI, value: {{ printf "s3://%s/%s" $bucket .Values.modelPrefix | quote }}}
                volumeMounts:
                  - {name: model-cache, mountPath: /model-cache}
            containers:
              - name: ray-worker
                image: rayproject/ray:{{ $ray }}-gpu
                resources:
                  requests: {cpu: "2", memory: 12Gi}
                  limits: {cpu: "4", memory: 14Gi, nvidia.com/gpu: "1"}
                env:
                  - {name: AWS_DEFAULT_REGION, value: {{ $region | quote }}}
                  - {name: MODEL_BUCKET, value: {{ $bucket | quote }}}
                volumeMounts:
                  - {name: model-cache, mountPath: /model-cache}
                  - {name: serve-scripts, mountPath: /serve-scripts}
            volumes:
              - name: model-cache
                emptyDir: {sizeLimit: 80Gi}
              - name: serve-scripts
                configMap:
                  name: vllm-serve-script

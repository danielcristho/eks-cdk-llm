{{- $bucket := required "modelBucket is set by CDK" .Values.modelBucket }}
{{- $region := required "region is set by CDK" .Values.region }}
# Runs vLLM as a Ray Serve deployment, routes requests across replicas, autoscaler scales workers, Karpenter provisions GPU nodes
apiVersion: ray.io/v1
kind: RayService
metadata:
  name: vllm
  namespace: kuberay
spec:
  serveConfigV2: |
    applications:
      - name: vllm
        import_path: serve_vllm:build_app
        route_prefix: /
        runtime_env:
          pip:
            - vllm==0.8.5
            - ray[serve]==2.43.0
            - numpy<2
          env_vars:
            PYTHONPATH: /serve-scripts
        args:
          model: /model-cache/current
          served_model_name: qwen-lora
          dtype: half
          quantization: awq
          max_model_len: 4096
          download_dir: /model-cache
          _script_sha: {{ .Values.scriptSha | quote }}
        deployments:
          - name: VLLMDeployment
            max_ongoing_requests: 5
            autoscaling_config:
              # 1, not 0: a new cluster takes traffic once a replica has the new model loaded
              min_replicas: 1
              max_replicas: 2  # set max 2 × g4dn.xlarge
              target_ongoing_requests: 2
            ray_actor_options:
              num_gpus: 1
              memory: 12288
  rayClusterConfig:
    rayVersion: "2.43.0"
    enableInTreeAutoscaling: true
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-gpus: "0"
      template:
        metadata:
          labels:
            role: ray-head
        spec:
          nodeSelector:
            role: system
          containers:
            - name: ray-head
              image: rayproject/ray:2.43.0-gpu
              ports:
                - {containerPort: 6379, name: gcs}
                - {containerPort: 10001, name: client}
                - {containerPort: 8265, name: dashboard}
                - {containerPort: 8000, name: serve}
              resources:
                requests: {cpu: "1", memory: 3Gi}
                limits: {cpu: "2", memory: 6Gi}
              volumeMounts:
                - {name: serve-scripts, mountPath: /serve-scripts}
          volumes:
            - name: serve-scripts
              configMap:
                name: vllm-serve-script
    workerGroupSpecs:
      - groupName: gpu-workers
        replicas: 0
        minReplicas: 0
        maxReplicas: 2  # set max 2 × g4dn.xlarge
        rayStartParams:
          num-gpus: "1"
        template:
          metadata:
            labels:
              role: ray-worker
              workload: gpu
          spec:
            tolerations:
              - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
            nodeSelector:
              workload: gpu
            terminationGracePeriodSeconds: 120
            initContainers:
              - name: model-cache-sync
                image: amazon/aws-cli:2.17.62
                command: ["sh", "-c", "aws s3 sync \"$MODEL_URI\" /model-cache/current"]
                env:
                  - {name: AWS_DEFAULT_REGION, value: {{ $region | quote }}}
                  - {name: MODEL_URI, value: {{ printf "s3://%s/%s" $bucket .Values.modelPrefix | quote }}}
                volumeMounts:
                  - {name: model-cache, mountPath: /model-cache}
            containers:
              - name: ray-worker
                image: rayproject/ray:2.43.0-gpu
                resources:
                  requests: {cpu: "2", memory: 12Gi}
                  limits: {cpu: "4", memory: 14Gi, nvidia.com/gpu: "1"}
                env:
                  - {name: AWS_DEFAULT_REGION, value: {{ $region | quote }}}
                  - {name: MODEL_BUCKET, value: {{ $bucket | quote }}}
                volumeMounts:
                  - {name: model-cache, mountPath: /model-cache}
                  - {name: serve-scripts, mountPath: /serve-scripts}
            volumes:
              - name: model-cache
                emptyDir: {sizeLimit: 80Gi}
              - name: serve-scripts
                configMap:
                  name: vllm-serve-script
